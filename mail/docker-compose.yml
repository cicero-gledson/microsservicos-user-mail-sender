services:
  postgres:
    image: postgres:15.3
    container_name: ms-mail-db
    environment:
      POSTGRES_DB: ms-mail-ms
      POSTGRES_USER: postgres-mail
      POSTGRES_PASSWORD: postgres-password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: