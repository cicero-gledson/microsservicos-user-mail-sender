spring:
  application:
    name: mail

  datasource:
    url: jdbc:postgresql://localhost:5433/ms-mail-ms
    username: postgres-mail
    password: postgres-password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080